name: Harness CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: these jobs only read the checked-out tree. Nothing here
# needs write access to the repository, packages, or any other scope.
permissions:
  contents: read

jobs:
  validate-assets:
    name: Validate harness assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Guarantees a Node runtime is present and is at or above the floor the
      # shared wrapper asserts. Without this step a missing Node would surface
      # as a shell 127, not as a named failure.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install` anywhere in this workflow — the validators are
      # zero-dependency by design (PRD Section 6, NFR-1).
      - name: Report Node version
        run: node --version

      # --- Validators must PASS against the real tree -------------------
      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate no personal paths
        run: node scripts/ci/validate-personal-paths.js

      - name: Validate unicode safety
        run: node scripts/ci/validate-unicode-safety.js

      - name: Validate version consistency
        run: node scripts/ci/validate-version-consistency.js

      # Freezes the load-bearing literal strings of the verification upgrade:
      # the four verdicts, the deny-by-default write scope, the exact
      # malformed-report status, the tracer notice, and the agent count. These
      # are strings the PRD mandates verbatim — rewording one SHOULD fail CI.
      - name: Validate verification upgrade
        run: node scripts/ci/validate-verification-upgrade.js

      # --- Falsifiability: each validator must FAIL on a seeded defect ---
      # A validator that only ever passes proves nothing. These steps invert
      # the exit code, so CI goes red if a validator stops catching the bug it
      # was written to catch.
      - name: Falsify — agents validator catches a bad agent
        run: '! node scripts/ci/validate-agents.js --root tests/fixtures/ci/bad-agent --min 1'

      - name: Falsify — skills validator catches a bad skill
        run: '! node scripts/ci/validate-skills.js --root tests/fixtures/ci/bad-skill --min 1'

      - name: Falsify — hooks validator catches a bad hooks.json
        run: '! node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks'

      - name: Falsify — hooks validator rejects an inline node -e bootstrap
        run: '! node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks-inline-bootstrap'

      - name: Falsify — hooks validator rejects a hook bypassing the wrapper
        run: '! node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks-foreign-script'

      - name: Falsify — hooks validator rejects a hook with no id
        run: '! node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks-missing-id'

      - name: Falsify — personal-path validator catches a leaked home path
        run: '! node scripts/ci/validate-personal-paths.js --root tests/fixtures/ci/bad-personal-path --min 1'

      - name: Falsify — unicode validator catches invisible and homoglyph characters
        run: '! node scripts/ci/validate-unicode-safety.js --root tests/fixtures/ci/bad-unicode --min 0'

      - name: Falsify — version validator catches disagreeing versions
        run: '! node scripts/ci/validate-version-consistency.js --root tests/fixtures/ci/bad-version'

      # One seeded-bad fixture per assertion family. Each fixture is a complete
      # passing mirror of every file the validator opens, except for its single
      # defect — so a red run proves that specific assertion fired, rather than
      # proving only that some file was missing.
      - name: Falsify — verification-upgrade validator catches a writable plan-critic
        run: '! node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-plan-critic-write'

      - name: Falsify — verification-upgrade validator catches a verifier retaining Bash
        run: '! node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-verifier-tools'

      - name: Falsify — verification-upgrade validator catches the old three-verdict line
        run: '! node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-verifier-verdicts'

      - name: Falsify — verification-upgrade validator catches the old Level 4 advisory note
        run: '! node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-merge-ready-note'

      - name: Falsify — verification-upgrade validator catches a disagreeing agent count
        run: '! node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-agent-count'

      # The confidence filter only spares findings already labelled CRITICAL, so
      # removing the classification pin lets a borderline auth bypass be filed
      # HIGH and then dropped — the security gate going quiet with nothing
      # appearing to fail.
      - name: Falsify — verification-upgrade validator catches a softened classification pin
        run: '! node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-security-auditor-filter'

      # --- Positive control: allowlisted placeholders must still PASS ----
      - name: Control — documented path placeholders are accepted
        run: node scripts/ci/validate-personal-paths.js --root tests/fixtures/ci/good-personal-path --min 1

      # --- Anti-vacuity: a validator matching zero files must FAIL -------
      # This is the check that stops "exits 0" from meaning "found nothing".
      - name: Anti-vacuity — agents validator fails on an empty tree
        run: '! node scripts/ci/validate-agents.js --root "$(mktemp -d)"'

      - name: Anti-vacuity — skills validator fails on an empty tree
        run: '! node scripts/ci/validate-skills.js --root "$(mktemp -d)"'

      - name: Anti-vacuity — personal-path validator fails on an empty tree
        run: '! node scripts/ci/validate-personal-paths.js --root "$(mktemp -d)"'

      - name: Anti-vacuity — unicode validator fails on an empty tree
        run: '! node scripts/ci/validate-unicode-safety.js --root "$(mktemp -d)"'

      - name: Anti-vacuity — version validator fails on an empty tree
        run: '! node scripts/ci/validate-version-consistency.js --root "$(mktemp -d)"'

      - name: Anti-vacuity — verification-upgrade validator fails on an empty tree
        run: '! node scripts/ci/validate-verification-upgrade.js --root "$(mktemp -d)"'

  hook-tests:
    name: Hook contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install`: the hooks are zero-dependency by design.
      - name: Run hook fixture tests
        run: node tests/hooks/run-tests.js

  hook-syntax-floor:
    name: Hook wrapper parses on old Node
    runs-on: ubuntu-latest

    # The wrapper's fail-open contract depends on its Node version gate being
    # reachable. If the file cannot even be PARSED by an old Node, the gate
    # never runs and nothing is reported — so parsing under an old runtime is
    # itself the thing under test. Claude Code may be launched from a GUI whose
    # PATH resolves a much older node than an interactive shell would.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up an old Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Wrapper must parse under Node 14
        run: node --check hooks/lib/run-hook.js

  shell-syntax:
    name: Installer shell syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check install.sh parses
        run: bash -n install.sh

      # PRD Section 6, NFR-1 / AC-9: the Node boundary stays at CI. The
      # installer runs on adopter machines and must depend on nothing but a
      # POSIX shell. Portable word-boundary form — GNU-only \b is not assumed.
      - name: Assert install.sh invokes neither node nor jq
        run: |
          if grep -nE '(^|[^a-zA-Z])(node|jq)([^a-zA-Z]|$)' install.sh | grep -v '^[0-9]*: *#'; then
            echo "install.sh must not invoke node or jq (PRD Section 6, NFR-1 / AC-9)"
            exit 1
          fi

      # The installer belongs to a different Node zone than the hooks: it must
      # run on a bare POSIX shell, so it must not reach into hooks/ either.
      - name: Assert install.sh does not reference the hook runtime
        run: |
          if grep -n 'hooks/lib\|run-hook' install.sh | grep -v '^[0-9]*: *#'; then
            echo "install.sh must not reference the hook runtime (PRD Section 7, NFR-1)"
            exit 1
          fi
