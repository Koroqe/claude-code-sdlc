name: Harness CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: these jobs only read the checked-out tree. Nothing here
# needs write access to the repository, packages, or any other scope.
permissions:
  contents: read

jobs:
  validate-assets:
    name: Validate harness assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Guarantees a Node runtime is present and is at or above the floor the
      # shared wrapper asserts. Without this step a missing Node would surface
      # as a shell 127, not as a named failure.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install` anywhere in this workflow — the validators are
      # zero-dependency by design (PRD Section 6, NFR-1).
      - name: Report Node version
        run: node --version

      # --- Validators must PASS against the real tree -------------------
      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate no personal paths
        run: node scripts/ci/validate-personal-paths.js

      - name: Validate unicode safety
        run: node scripts/ci/validate-unicode-safety.js

      - name: Validate version consistency
        run: node scripts/ci/validate-version-consistency.js

      # Freezes the load-bearing literal strings of the verification upgrade:
      # the four verdicts, the deny-by-default write scope, the exact
      # malformed-report status, the tracer notice, and the agent count. These
      # are strings the PRD mandates verbatim — rewording one SHOULD fail CI.
      - name: Validate verification upgrade
        run: node scripts/ci/validate-verification-upgrade.js

      # Drift check (PRD Section 10, FR-10): every agents/*.md `model:` value
      # must match the profile `.sdlc-model-profile` claims (absent -> the
      # shipped `quality` baseline), and install.sh's model_for_role() case
      # arms must byte-compare against scripts/ci/lib/model-profiles.js.
      # --assert-baseline additionally fails if a receipt is present at all
      # — it must never be committed; it is a local, install-time artifact.
      - name: Validate model profile drift
        run: node scripts/ci/validate-model-profile.js --assert-baseline

      # Confirms the 52 FIXTURE-class test cases in
      # verification-review-upgrade_test_cases.md still have the committed
      # inputs they need. This does NOT execute any FIXTURE case — no API
      # access exists in CI to invoke an agent headlessly. It only catches
      # fixture rot: a fixture directory renamed, emptied, or deleted while
      # the QA document and manifest still claim it exists.
      - name: Validate fixture manifest
        run: node scripts/ci/validate-fixture-manifest.js

      # --- Falsifiability: each validator must FAIL on a seeded defect ---
      # A validator that only ever passes proves nothing. These steps invert
      # the exit code, so CI goes red if a validator stops catching the bug it
      # was written to catch.
      - name: Falsify — agents validator catches a bad agent
        run: node scripts/ci/validate-agents.js --root tests/fixtures/ci/bad-agent --min 1 --expect-failure "frontmatter fence"

      # PRD Section 10, FR-11: `effort:` became a required frontmatter field
      # in the same commit that added it to all 14 agents. These two fixtures
      # prove the two ways an `effort:` value can be wrong — an unrecognized
      # level, and the field omitted entirely — each fail for its own reason.
      - name: Falsify — agents validator catches an unrecognized effort level
        run: node scripts/ci/validate-agents.js --root tests/fixtures/ci/bad-agent-effort --min 1 --expect-failure "is not a known level"

      - name: Falsify — agents validator catches a missing effort field
        run: node scripts/ci/validate-agents.js --root tests/fixtures/ci/bad-agent-effort-missing --min 1 --expect-failure "missing or empty required frontmatter field \`effort\`"

      - name: Falsify — skills validator catches a bad skill
        run: node scripts/ci/validate-skills.js --root tests/fixtures/ci/bad-skill --min 1 --expect-failure "argument-hint"

      - name: Falsify — hooks validator catches a bad hooks.json
        run: node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks --expect-failure "unknown hook event"

      - name: Falsify — hooks validator rejects an inline node -e bootstrap
        run: node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks-inline-bootstrap --expect-failure "bad:inline"

      - name: Falsify — hooks validator rejects a hook bypassing the wrapper
        run: node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks-foreign-script --expect-failure "bad:foreign"

      - name: Falsify — hooks validator rejects a hook with no id
        run: node scripts/ci/validate-hooks.js --root tests/fixtures/ci/bad-hooks-missing-id --expect-failure "namespaced ids are required"

      - name: Falsify — personal-path validator catches a leaked home path
        run: node scripts/ci/validate-personal-paths.js --root tests/fixtures/ci/bad-personal-path --min 1 --expect-failure "must not ship"

      - name: Falsify — unicode validator catches invisible and homoglyph characters
        run: node scripts/ci/validate-unicode-safety.js --root tests/fixtures/ci/bad-unicode --min 0 --expect-failure "zero-width character"

      - name: Falsify — version validator catches disagreeing versions
        run: node scripts/ci/validate-version-consistency.js --root tests/fixtures/ci/bad-version --expect-failure "version strings disagree"

      # One seeded-bad fixture per assertion family. Each fixture is a complete
      # passing mirror of every file the validator opens, except for its single
      # defect — so a red run proves that specific assertion fired, rather than
      # proving only that some file was missing.
      - name: Falsify — verification-upgrade validator catches a writable plan-critic
        run: node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-plan-critic-write --expect-failure "TC-6.2"

      - name: Falsify — verification-upgrade validator catches a verifier retaining Bash
        run: node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-verifier-tools --expect-failure "TC-5.3"

      - name: Falsify — verification-upgrade validator catches the old three-verdict line
        run: node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-verifier-verdicts --expect-failure "FR-1.1"

      - name: Falsify — verification-upgrade validator catches the old Level 4 advisory note
        run: node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-merge-ready-note --expect-failure "FR-1.5"

      - name: Falsify — verification-upgrade validator catches a disagreeing agent count
        run: node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-agent-count --expect-failure "TC-6.6"

      # The confidence filter only spares findings already labelled CRITICAL, so
      # removing the classification pin lets a borderline auth bypass be filed
      # HIGH and then dropped — the security gate going quiet with nothing
      # appearing to fail.
      - name: Falsify — verification-upgrade validator catches a softened classification pin
        run: node scripts/ci/validate-verification-upgrade.js --root tests/fixtures/ci/verification-upgrade/bad-security-auditor-filter --expect-failure "Classification is pinned"

      # A rotted fixture (renamed/emptied/deleted) must fail loudly — it is
      # the one failure mode this validator exists to catch, per the QA
      # document's own count summary ("52 FIXTURE ... committed under
      # tests/fixtures/").
      - name: Falsify — fixture-manifest validator catches a rotted fixture path
        run: node scripts/ci/validate-fixture-manifest.js --root tests/fixtures/ci/fixture-manifest/bad-missing-fixture --expect-failure "fixture path does not exist"

      # PRD Section 10, FR-10.4: six seeded-bad-or-boundary fixtures for the
      # model-profile drift validator, each a passing mirror except one
      # deliberate defect. Every fixture must fail for its own named reason
      # — a generic mismatch count would let a rotted fixture keep CI green.
      - name: Falsify — model-profile validator catches a stale file under a committed profile
        run: "node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/stale-file --min 1 --expect-failure \"agents/build-runner.md: model 'sonnet', expected 'haiku'\""

      - name: Falsify — model-profile validator catches a hand-edited alias with no receipt present
        run: "node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/no-receipt-fable --min 1 --expect-failure \"agents/architect.md: model 'fable', expected 'opus'\""

      # Distinct from the failure above: `fable` remains a recognized alias
      # under validate-agents.js's own, looser purpose (FR-10.2) — this is
      # what UC-11 documents as the pass/fail contrast between the two checks.
      - name: Control — agents validator still passes the same fixture (fable is a recognized alias)
        run: node scripts/ci/validate-agents.js --root tests/fixtures/ci/model-profile/no-receipt-fable --min 1

      - name: Falsify — model-profile validator catches install.sh/CI table disagreement
        run: node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/install-table-mismatch --min 1 --expect-failure "balanced:plan-critic"

      - name: Control — model-profile validator passes the inherit profile and its wildcard arm
        run: node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/inherit-wildcard --min 1

      - name: Falsify — model-profile validator rejects a malformed receipt value
        run: node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/bad-receipt --min 1 --expect-failure "unrecognized profile 'fable'"

      # This fixture is internally consistent (receipt and tree agree), so it
      # passes plainly — proving --assert-baseline is what fails it, not the
      # ordinary per-file drift check (PRD Section 10, FR-9).
      - name: Control — model-profile validator passes an internally consistent committed receipt without the flag
        run: node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/committed-receipt --min 1

      - name: Falsify — model-profile validator rejects the same committed receipt under --assert-baseline
        run: node scripts/ci/validate-model-profile.js --root tests/fixtures/ci/model-profile/committed-receipt --min 1 --assert-baseline --expect-failure "must never be committed"

      # --- Positive control: allowlisted placeholders must still PASS ----
      - name: Control — documented path placeholders are accepted
        run: node scripts/ci/validate-personal-paths.js --root tests/fixtures/ci/good-personal-path --min 1

      # --- Anti-vacuity: a validator matching zero files must FAIL -------
      # This is the check that stops "exits 0" from meaning "found nothing".
      - name: Anti-vacuity — agents validator fails on an empty tree
        run: node scripts/ci/validate-agents.js --root "$(mktemp -d)" --expect-failure "matches too few files"

      - name: Anti-vacuity — skills validator fails on an empty tree
        run: node scripts/ci/validate-skills.js --root "$(mktemp -d)" --expect-failure "matches too few files"

      - name: Anti-vacuity — personal-path validator fails on an empty tree
        run: node scripts/ci/validate-personal-paths.js --root "$(mktemp -d)" --expect-failure "matches too few files"

      - name: Anti-vacuity — unicode validator fails on an empty tree
        run: node scripts/ci/validate-unicode-safety.js --root "$(mktemp -d)" --expect-failure "matches too few files"

      - name: Anti-vacuity — version validator fails on an empty tree
        run: node scripts/ci/validate-version-consistency.js --root "$(mktemp -d)" --expect-failure "matches too few files"

      - name: Anti-vacuity — verification-upgrade validator fails on an empty tree
        run: node scripts/ci/validate-verification-upgrade.js --root "$(mktemp -d)" --expect-failure "matches too few files"

      - name: Anti-vacuity — fixture-manifest validator fails on an empty tree
        run: node scripts/ci/validate-fixture-manifest.js --root "$(mktemp -d)" --expect-failure "matches too few"

  hook-tests:
    name: Hook contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install`: the hooks are zero-dependency by design.
      - name: Run hook fixture tests
        run: node tests/hooks/run-tests.js

  hook-syntax-floor:
    name: Hook wrapper parses on old Node
    runs-on: ubuntu-latest

    # The wrapper's fail-open contract depends on its Node version gate being
    # reachable. If the file cannot even be PARSED by an old Node, the gate
    # never runs and nothing is reported — so parsing under an old runtime is
    # itself the thing under test. Claude Code may be launched from a GUI whose
    # PATH resolves a much older node than an interactive shell would.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up an old Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Wrapper must parse under Node 14
        run: node --check hooks/lib/run-hook.js

  shell-syntax:
    name: Installer shell syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check install.sh parses
        run: bash -n install.sh

      # PRD Section 6, NFR-1 / AC-9: the Node boundary stays at CI. The
      # installer runs on adopter machines and must depend on nothing but a
      # POSIX shell. Portable word-boundary form — GNU-only \b is not assumed.
      - name: Assert install.sh invokes neither node nor jq
        run: |
          if grep -nE '(^|[^a-zA-Z])(node|jq)([^a-zA-Z]|$)' install.sh | grep -v '^[0-9]*: *#'; then
            echo "install.sh must not invoke node or jq (PRD Section 6, NFR-1 / AC-9)"
            exit 1
          fi

      # The installer belongs to a different Node zone than the hooks: it must
      # run on a bare POSIX shell, so it must not reach into hooks/ either.
      - name: Assert install.sh does not reference the hook runtime
        run: |
          if grep -n 'hooks/lib\|run-hook' install.sh | grep -v '^[0-9]*: *#'; then
            echo "install.sh must not reference the hook runtime (PRD Section 7, NFR-1)"
            exit 1
          fi
