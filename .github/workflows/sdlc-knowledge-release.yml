name: sdlc-knowledge release

# Cross-platform release pipeline for the `sdlc-knowledge` Rust CLI.
#
# This workflow is INDEPENDENT of the SDLC repo's `release-engineer` Gate 9.
# Tagging scheme: `sdlc-knowledge-v<MAJOR>.<MINOR>.<PATCH>` — see
# `tools/sdlc-knowledge/RELEASING.md` for the full release procedure.
#
# Triggered by:
#   - pushing a tag matching `sdlc-knowledge-v*` (cuts a GitHub Release)
#   - manual `workflow_dispatch` (build verification only — no release)

on:
  push:
    tags:
      - 'sdlc-knowledge-v*'
  workflow_dispatch: {}

# Default least-privilege; the `release` job re-declares write access for itself.
permissions:
  contents: read

concurrency:
  group: sdlc-knowledge-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — actionlint self-check.
  # Gates the matrix: if the workflow file itself is malformed, do not waste
  # 4 runners building binaries.
  # ---------------------------------------------------------------------------
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1
        with:
          files: .github/workflows/sdlc-knowledge-release.yml

  # ---------------------------------------------------------------------------
  # Job 2 — cross-platform release build matrix.
  # Verbatim runner labels per architect decision (load-bearing for Slice 4):
  #   - darwin-arm64 → macos-14
  #   - darwin-x64   → macos-13
  #   - linux-x64    → ubuntu-latest
  #   - linux-arm64  → ubuntu-22.04-arm
  # Windows is deferred to iter-2 per RELEASING.md follow-ups.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runs-on: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runs-on: macos-13
            target: x86_64-apple-darwin
          - platform: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo build (release)
        run: |
          cargo build --release \
            -p sdlc-knowledge \
            --manifest-path tools/sdlc-knowledge/Cargo.toml \
            --target ${{ matrix.target }}

      - name: Assert binary size <= 10 MB (NFR-1.1)
        shell: bash
        run: |
          BIN="tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: binary not found at $BIN"
            exit 1
          fi
          # Portable size lookup: BSD stat (macOS) uses -f%z, GNU stat uses -c%s.
          size=$(stat -f%z "$BIN" 2>/dev/null || stat -c%s "$BIN")
          echo "Binary size: $size bytes"
          # 10485760 = 10 * 1024 * 1024 (NFR-1.1 budget).
          test "$size" -le 10485760

      - name: Smoke test (--version exits 0)
        shell: bash
        run: |
          BIN="tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge"
          "$BIN" --version

      - name: Stage release artifact
        shell: bash
        run: |
          BIN="tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge"
          mkdir -p dist
          cp "$BIN" "dist/sdlc-knowledge-${{ matrix.platform }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-knowledge-${{ matrix.platform }}
          path: dist/sdlc-knowledge-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3 — cut GitHub Release with all 4 binaries attached.
  # Runs only when the workflow was triggered by a `sdlc-knowledge-v*` tag
  # (workflow_dispatch runs are build-verification-only — no release).
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdlc-knowledge-v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded artifacts
        shell: bash
        run: |
          ls -laR dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/sdlc-knowledge-darwin-arm64/sdlc-knowledge-darwin-arm64
            dist/sdlc-knowledge-darwin-x64/sdlc-knowledge-darwin-x64
            dist/sdlc-knowledge-linux-x64/sdlc-knowledge-linux-x64
            dist/sdlc-knowledge-linux-arm64/sdlc-knowledge-linux-arm64
          fail_on_unmatched_files: true
