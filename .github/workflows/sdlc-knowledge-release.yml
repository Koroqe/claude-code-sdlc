name: sdlc-knowledge release

# Cross-platform release pipeline for the `sdlc-knowledge` Rust CLI.
#
# This workflow is INDEPENDENT of the SDLC repo's `release-engineer` Gate 9.
# Tagging scheme: `sdlc-knowledge-v<MAJOR>.<MINOR>.<PATCH>` — see
# `tools/sdlc-knowledge/RELEASING.md` for the full release procedure.
#
# Triggered by:
#   - pushing a tag matching `sdlc-knowledge-v*` (cuts a GitHub Release)
#   - manual `workflow_dispatch` (build verification only — no release)

on:
  push:
    tags:
      - 'sdlc-knowledge-v*'
  workflow_dispatch: {}

# Default least-privilege; the `release` job re-declares write access for itself.
permissions:
  contents: read

concurrency:
  group: sdlc-knowledge-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — actionlint self-check.
  # Gates the matrix: if the workflow file itself is malformed, do not waste
  # 4 runners building binaries.
  # ---------------------------------------------------------------------------
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1
        with:
          files: .github/workflows/sdlc-knowledge-release.yml

  # ---------------------------------------------------------------------------
  # Job 2 — cross-platform release build matrix.
  # Verbatim runner labels per architect decision (load-bearing for Slice 4):
  #   - darwin-arm64 → macos-14
  #   - darwin-x64   → macos-13
  #   - linux-x64    → ubuntu-latest
  #   - linux-arm64  → ubuntu-22.04-arm
  #   - windows-x64  → windows-latest
  # TODO(iter-3.1): Windows build deferred if pdf.rs unix-only imports prevent
  # compilation; iter-3.1 will gate pdf.rs cfg(unix) attributes. The matrix
  # entry is defined now so fail-fast: false lets other platforms succeed even
  # if Windows fails to compile due to `std::os::unix::fs::PermissionsExt`
  # usage in `tools/sdlc-knowledge/src/pdf.rs:34-77`.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runs-on: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runs-on: macos-13
            target: x86_64-apple-darwin
          - platform: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # Pre-build: download pdfium dynamic library for the target platform.
      # The `sdlc-knowledge` binary links against pdfium-render at runtime via
      # the canonical path `~/.claude/tools/sdlc-knowledge/pdfium/lib/`. The
      # release-build smoke test below requires the library to be present.
      # -----------------------------------------------------------------------
      - name: Determine pdfium asset name
        id: pdfium-asset
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            darwin-arm64)   echo "asset=pdfium-mac-arm64.tgz" >> "$GITHUB_OUTPUT" ;;
            darwin-x64)     echo "asset=pdfium-mac-x64.tgz" >> "$GITHUB_OUTPUT" ;;
            linux-x64)      echo "asset=pdfium-linux-x64.tgz" >> "$GITHUB_OUTPUT" ;;
            linux-arm64)    echo "asset=pdfium-linux-arm64.tgz" >> "$GITHUB_OUTPUT" ;;
            windows-x64)    echo "asset=pdfium-win-x64.tgz" >> "$GITHUB_OUTPUT" ;;
            *)              echo "ERROR: unknown platform ${{ matrix.platform }}" >&2; exit 1 ;;
          esac

      - name: Download pdfium dynamic library
        env:
          # Must match KNOWLEDGE_PDFIUM_VERSION in install.sh
          PDFIUM_VERSION: chromium/7802
        shell: bash
        run: |
          mkdir -p "$HOME/.claude/tools/sdlc-knowledge/pdfium/lib"
          curl --proto '=https' --tlsv1.2 -fsSL --max-redirs 5 --max-time 120 \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_VERSION}/${{ steps.pdfium-asset.outputs.asset }}" \
            -o /tmp/pdfium.tgz
          mkdir -p /tmp/pdfium-staging
          tar --no-same-owner --no-same-permissions -xzf /tmp/pdfium.tgz -C /tmp/pdfium-staging
          # Architect action item #3 — grouped alternation: bblanchon Windows
          # archives ship `pdfium.dll` (no `lib` prefix per MSFT convention)
          # while Linux/macOS ship `libpdfium.{so,dylib}`. The `\( ... \)` are
          # find's grouping parens (escaped for the shell).
          find /tmp/pdfium-staging -maxdepth 3 \( -name 'libpdfium*' -o -name 'pdfium*' \) -type f -exec cp {} "$HOME/.claude/tools/sdlc-knowledge/pdfium/lib/" \;
          ls -la "$HOME/.claude/tools/sdlc-knowledge/pdfium/lib/"

      - name: Cargo build (release)
        run: |
          cargo build --release \
            -p sdlc-knowledge \
            --manifest-path tools/sdlc-knowledge/Cargo.toml \
            --target ${{ matrix.target }}

      - name: Assert binary size <= 10 MB (NFR-1.1)
        shell: bash
        run: |
          # Windows Cargo emits `sdlc-knowledge.exe`; unix targets emit `sdlc-knowledge`.
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          BIN="tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge${EXT}"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: binary not found at $BIN"
            exit 1
          fi
          # Portable size lookup: BSD stat (macOS) uses -f%z, GNU stat uses -c%s,
          # Windows Git Bash has neither — fall back to `wc -c`.
          size=$(stat -f%z "$BIN" 2>/dev/null || stat -c%s "$BIN" 2>/dev/null || wc -c < "$BIN")
          echo "Binary size: $size bytes"
          # 10485760 = 10 * 1024 * 1024 (NFR-1.1 budget).
          test "$size" -le 10485760

      - name: Smoke test (--version exits 0)
        shell: bash
        run: |
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          BIN="tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge${EXT}"
          "$BIN" --version

      # -----------------------------------------------------------------------
      # Smoke test: ingest the calibre-sample.pdf fixture and assert that
      # pdfium-render extracts at least one chunk. Detects regressions in the
      # pdfium dynamic-library wiring or the extraction pipeline before the
      # binary is shipped to users.
      # -----------------------------------------------------------------------
      - name: Smoke test calibre fixture extraction
        shell: bash
        run: |
          mkdir -p /tmp/sdlc-smoke/.claude/knowledge
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          BIN="$GITHUB_WORKSPACE/tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge${EXT}"
          "$BIN" --version
          # ingest the calibre fixture from a writable cwd
          cd /tmp/sdlc-smoke
          OUT=$("$BIN" ingest "$GITHUB_WORKSPACE/tools/sdlc-knowledge/tests/fixtures/calibre-sample.pdf" --json)
          echo "$OUT"
          echo "$OUT" | jq -e '.succeeded_count >= 1' >/dev/null

      - name: Stage release artifact
        shell: bash
        run: |
          # Windows Cargo emits `sdlc-knowledge.exe`; the staged artifact name
          # also carries `.exe` so users can run it without renaming.
          SRC_EXT=""
          DST_EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            SRC_EXT=".exe"
            DST_EXT=".exe"
          fi
          BIN="tools/sdlc-knowledge/target/${{ matrix.target }}/release/sdlc-knowledge${SRC_EXT}"
          mkdir -p dist
          cp "$BIN" "dist/sdlc-knowledge-${{ matrix.platform }}${DST_EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-knowledge-${{ matrix.platform }}
          path: dist/sdlc-knowledge-${{ matrix.platform }}${{ matrix.platform == 'windows-x64' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3 — cut GitHub Release with all 5 binaries + source tarball attached.
  # Runs only when the workflow was triggered by a `sdlc-knowledge-v*` tag
  # (workflow_dispatch runs are build-verification-only — no release).
  #
  # The source tarball is built here (not in the matrix) because it is
  # platform-independent — `git archive` honors `.gitattributes` `export-ignore`
  # to strip `.claude/`, `docs/qa/`, `docs/use-cases/`, `books/` (see commit
  # 7e4789c).
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdlc-knowledge-v')
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for git archive)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded artifacts
        shell: bash
        run: |
          ls -laR dist/

      - name: Build source tarball
        id: source-tarball
        shell: bash
        run: |
          # Strip the `sdlc-knowledge-v` prefix from the tag to derive VERSION.
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#sdlc-knowledge-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ARCHIVE="claude-code-sdlc-${VERSION}-source.tar.gz"
          # `.gitattributes` (commit 7e4789c) drives `export-ignore` so
          # `.claude/`, `docs/qa/`, `docs/use-cases/`, `books/` are stripped.
          git archive --format=tar.gz \
            --prefix="claude-code-sdlc-${VERSION}/" \
            -o "${ARCHIVE}" \
            HEAD
          ls -la "${ARCHIVE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/sdlc-knowledge-darwin-arm64/sdlc-knowledge-darwin-arm64
            dist/sdlc-knowledge-darwin-x64/sdlc-knowledge-darwin-x64
            dist/sdlc-knowledge-linux-x64/sdlc-knowledge-linux-x64
            dist/sdlc-knowledge-linux-arm64/sdlc-knowledge-linux-arm64
            dist/sdlc-knowledge-windows-x64/sdlc-knowledge-windows-x64.exe
            claude-code-sdlc-${{ steps.source-tarball.outputs.version }}-source.tar.gz
          fail_on_unmatched_files: true
